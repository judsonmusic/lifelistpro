<div class="app-shell">
  <!-- Top App Bar -->
  <header class="app-header">
    <mat-toolbar class="toolbar" color="primary">
      <span class="title">Life list Pro</span>
      <span class="spacer"></span>
      <span class="bundle">Web: {{ webBundleVersion }}</span>
    </mat-toolbar>
  </header>

  <!-- Main Content -->
  <main class="app-content">
    <ng-container [ngSwitch]="activeTab">
      <!-- TAB: Todos -->
      <section *ngSwitchCase="'todos'">
        <mat-card class="card" appearance="outlined">
          <mat-card-title>To-Do</mat-card-title>
          <mat-card-content>
            <div class="row">
              <mat-form-field appearance="outline" class="full">
                <mat-label>Add item</mat-label>
                <input matInput [formControl]="newTodo" (keyup.enter)="add()" />
              </mat-form-field>

              <button
                mat-raised-button
                color="primary"
                (click)="add()"
                [disabled]="newTodo.invalid"
              >
                Add
              </button>
            </div>

            <div class="liveupdate">
              <button
                mat-stroked-button
                color="primary"
                (click)="checkNow()"
                [disabled]="checking"
              >
                {{ checking ? "Checking…" : "Check now" }}
              </button>
              <span class="status" *ngIf="status">{{ status }}</span>
            </div>
          </mat-card-content>
        </mat-card>

        <mat-card class="card" appearance="outlined">
          <mat-card-title>Items</mat-card-title>
          <mat-card-content>
            <div *ngIf="todos.length === 0" class="empty">Nothing yet.</div>

            <mat-list *ngIf="todos.length > 0">
              <mat-list-item *ngFor="let t of todos">
                <div class="item">
                  <div class="text">{{ t.text }}</div>
                  <div class="actions">
                    <button mat-stroked-button (click)="edit(t)">Edit</button>
                    <button mat-stroked-button color="warn" (click)="delete(t)">
                      Delete
                    </button>
                  </div>
                </div>
              </mat-list-item>
            </mat-list>
          </mat-card-content>
        </mat-card>
      </section>

      <!-- TAB: About -->
      <section *ngSwitchCase="'about'">
        <mat-card class="card" appearance="outlined">
          <mat-card-title>About</mat-card-title>
          <mat-card-content>
            <p class="about-line"><b>LifelistPro</b> demo</p>
            <p class="about-line">
              Web bundle: <b>{{ webBundleVersion }}</b>
            </p>
            <p class="about-line">Purpose: show Capawesome Live Updates.</p>
          </mat-card-content>
        </mat-card>
      </section>
    </ng-container>
  </main>

  <!-- Bottom Tabs -->
  <footer class="app-footer">
    <nav class="bottom-nav" mat-tab-nav-bar [tabPanel]="tabPanel">
      <a
        mat-tab-link
        (click)="activeTab = 'todos'"
        [active]="activeTab === 'todos'"
      >
        Todos
      </a>
      <a
        mat-tab-link
        (click)="activeTab = 'about'"
        [active]="activeTab === 'about'"
      >
        About
      </a>
    </nav>

    <!-- REQUIRED by mat-tab-nav-bar -->
    <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
  </footer>
</div>
